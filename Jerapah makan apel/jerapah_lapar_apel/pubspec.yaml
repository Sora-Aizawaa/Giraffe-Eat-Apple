name: jerapah_lapar_apel
description: Game jerapah makan apel di pohon - dibuat dengan Flutter (semua grafis digambar via CustomPainter, tanpa aset gambar eksternal).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
